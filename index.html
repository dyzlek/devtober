<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Devtober 2026</title>
  <meta name="description" content="Un mot par jour pendant tout octobre, une création en code inspirée du mot.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="hub/hub.css?v=4">
</head>
<body>
  <!-- Barre de navigation (visible sur la page d'un jour) -->
  <header id="bar" class="bar" hidden>
    <nav class="crumbs" aria-label="Fil d'Ariane">
      <a href="#/">Devtober</a><span aria-hidden="true">/</span><strong id="crumb-day"></strong>
    </nav>
    <nav id="switch" class="switch" aria-label="Projets du jour" hidden></nav>
    <div class="bar-actions">
      <a id="prev" class="nav-btn" aria-label="Jour précédent"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></a>
      <a id="next" class="nav-btn" aria-label="Jour suivant"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></a>
      <button id="readme-btn" class="nav-btn" type="button" aria-label="Lire le README du jour" title="README du jour">
        <svg viewBox="0 0 24 24"><path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2z"/><path d="M22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"/></svg>
      </button>
    </div>
  </header>

  <!-- Accueil -->
  <main id="home" class="home">
    <section class="hero">
      <p class="tag">#devtober</p>
      <h1>Devtober <span>2026</span></h1>
      <p class="lead">Un mot par jour pendant tout octobre, une création en code inspirée du mot. Environ 1h30 à 2h par jour, pas besoin que ce soit parfait : l'important, c'est de publier.</p>
      <p id="progress" class="progress"></p>
    </section>
    <ol id="grid" class="days"></ol>
  </main>

  <!-- Page d'un jour -->
  <main id="day" class="day" hidden>
    <iframe id="frame" title="Création du jour" allow="clipboard-write"></iframe>
    <div id="empty" class="empty" hidden>
      <p class="empty-num"></p>
      <h2 class="empty-word"></h2>
      <p class="empty-text"></p>
    </div>
  </main>

  <dialog id="readme" class="readme" aria-labelledby="readme-title">
    <div class="readme-head">
      <h2 id="readme-title">README</h2>
      <button type="button" class="nav-btn" id="readme-close" aria-label="Fermer"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>
    <article id="readme-body" class="readme-body"></article>
  </dialog>

  <script type="module" src="hub/hub.js?v=7"></script>
</body>
</html>
