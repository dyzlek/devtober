<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Téléphone traduit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <header class="top">
      <p class="kicker">Devtober · 02 · Loop</p>
    </header>

    <!-- La phrase de départ -->
    <form id="phrase-form" class="phrase">
      <label for="phrase" class="sr-only">Phrase de départ</label>
      <input id="phrase" maxlength="220" autocomplete="off" spellcheck="true"
             value="Le chat de la voisine dort sur le toit depuis ce matin.">
      <button id="run" type="submit" class="run">
        <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
        <span>Lancer la boucle</span>
      </button>
    </form>

    <!-- La boucle -->
    <div class="stage">
      <section id="ring" class="ring" aria-label="La boucle des langues">
      <svg id="arrows" class="arrows" aria-hidden="true">
        <defs>
          <marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M1 1 L9 5 L1 9" fill="none" stroke="context-stroke" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </marker>
        </defs>
        <g id="arrow-paths"></g>
      </svg>

    </section>
    <div id="center" class="center">
        <p class="center-hint">Ajoute des langues depuis le bac,<br>puis lance la boucle.</p>
      </div>
    </div>

    <!-- Le bac des langues -->
    <section class="tray-wrap">
      <p class="tray-label">Langues disponibles · clique ou glisse dans la boucle</p>
      <div id="tray" class="tray"></div>
    </section>

  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
